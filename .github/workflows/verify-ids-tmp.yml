name: ZACASNO preveri id-je
on:
  push:
    branches: [claude/crypto-fomo-indicator-0qkkvk]
    paths: [verify_ids_tmp.py, .github/workflows/verify-ids-tmp.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python3 verify_ids_tmp.py
