name: Jutranje crypto porocilo

on:
  schedule:
    # GitHub Actions cron zna zamujati - danes je zamudilo za vec kot 3 ure (04:00 UTC
    # sprozilec se je dejansko izvedel sele okoli 07:30 UTC). Zato sirok casovni okvir
    # (03:00-11:30 UTC, vsakih 30 min) + spodnje varovalo, ki preveri "je ze >=06:00 PO
    # SLOVENSKEM CASU IN se DANES ni bilo poslano" - to ujame posiljanje ne glede na to,
    # kako pozno GitHub dejansko sprozi zagon, hkrati pa nikoli ne podvoji posiljanja.
    - cron: "*/30 3-11 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Prisilno poslji, tudi ce je bilo danes ze poslano (za testiranje)"
        type: boolean
        default: false

permissions:
  contents: write          # potrebno za commit stanja (state/*.json)

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preveri urnik (Ljubljana, >=06:00 in se ni poslano danes)
        run: |
          HOUR=$((10#$(TZ=Europe/Ljubljana date +%H)))
          TODAY=$(TZ=Europe/Ljubljana date +%F)
          LAST_SENT=$(python3 -c "import json;print(json.load(open('state/schedule_state.json')).get('last_sent_date',''))" 2>/dev/null || echo "")
          echo "Lokalni cas: ${HOUR}:xx, danasnji datum: $TODAY, nazadnje poslano: ${LAST_SENT:-(nikoli)}"
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "Rocni FORCE zagon - obidem varovalko urnika/podvojitve."
          elif [ "$HOUR" -lt 6 ]; then
            echo "Se ni 06:00 po slovenskem casu - preskocim."
            echo "SKIP=true" >> "$GITHUB_ENV"
          elif [ "$LAST_SENT" = "$TODAY" ]; then
            echo "Porocilo je bilo danes ze poslano - preskocim (preprecujem podvojitev)."
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            echo "Posiljam porocilo."
          fi

      - name: Setup Python
        if: env.SKIP != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poslji porocilo
        if: env.SKIP != 'true'
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRYPTOPANIC_API_KEY: ${{ secrets.CRYPTOPANIC_API_KEY }}
          PIONEX_API_KEY: ${{ secrets.PIONEX_API_KEY }}
          PIONEX_API_SECRET: ${{ secrets.PIONEX_API_SECRET }}
          # Opcijsko za onchain (za vecjo zanesljivost):
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: python crypto_report.py

      - name: Oznaci kot poslano danes
        if: env.SKIP != 'true'
        run: |
          mkdir -p state
          TODAY=$(TZ=Europe/Ljubljana date +%F)
          python3 -c "import json,os; os.makedirs('state', exist_ok=True); json.dump({'last_sent_date': '$TODAY'}, open('state/schedule_state.json','w'), indent=2)"

      - name: Shrani stanje (onchain saldi, urnik, likvidnost)
        if: env.SKIP != 'true'
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "crypto-report-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state/
            git commit -m "Posodobitev stanja [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "Ni sprememb stanja."
          fi
