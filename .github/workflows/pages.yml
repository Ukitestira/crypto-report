name: Spletna stran (GitHub Pages)

# Objavi mapo site/ + config.json na GitHub Pages.
# Stran sama v brskalniku pridobiva sveze podatke (CoinGecko, Binance), zato
# ponovna objava ni potrebna - samo ob spremembi strani ali portfelja.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "config.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Testi FOMO logike
        run: node --test site/fomo.test.js site/sentiment.test.js

      - name: Pripravi stran
        run: |
          mkdir -p _site
          cp site/index.html site/style.css site/app.js site/fomo.js site/sentiment.js _site/
          cp config.json _site/config.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
