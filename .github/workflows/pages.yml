name: Spletna stran (GitHub Pages)

# Objavi mapo site/ + config.json na GitHub Pages.
# Stran sama v brskalniku pridobiva sveze podatke (CoinGecko, Binance), zato
# ponovna objava ni potrebna - samo ob spremembi strani ali portfelja.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "config.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Testi
        run: node --test site/fomo.test.js site/sentiment.test.js site/vault.test.js

      # Portfelj se objavi samo sifriran z geslom (secret SITE_PASSWORD).
      # Ce je nastavljen secret SITE_PATH, je stran v skriti podmapi, na glavnem
      # naslovu pa je nevtralna stran 404.
      - name: Pripravi stran
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SITE_PATH: ${{ secrets.SITE_PATH }}
        run: |
          if [ -n "$SITE_PATH" ] && ! printf '%s' "$SITE_PATH" | grep -Eq '^[A-Za-z0-9_-]{6,64}$'; then
            echo "SITE_PATH sme vsebovati samo crke, stevilke, - in _ (6-64 znakov)."; exit 1
          fi
          mkdir -p _site
          OUT="_site${SITE_PATH:+/$SITE_PATH}"
          mkdir -p "$OUT"
          cp site/index.html site/style.css site/app.js site/fomo.js site/sentiment.js site/vault.js "$OUT/"
          node site/encrypt-config.js config.json "$OUT/config.enc.json"
          # Vsaka objava dobi svojo razlicico skript/stilov, da brskalnik ne uporabi stare iz predpomnilnika.
          V="${GITHUB_SHA::12}"
          sed -i -E "s#(src|href)=\"(style\.css|vault\.js|fomo\.js|sentiment\.js|app\.js)\"#\1=\"\2?v=$V\"#g" "$OUT/index.html"
          grep -c "?v=$V" "$OUT/index.html"
          if [ -n "$SITE_PATH" ]; then
            cp site/decoy.html _site/index.html
          fi
          cp site/decoy.html _site/404.html
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
