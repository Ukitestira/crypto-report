<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>404 Not Found</title>
  <style>
    :root { --bg: #ffffff; --text: #24292f; --muted: #6e7781; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0d1117; --text: #e6edf3; --muted: #8b949e; } }
    :root[data-theme="dark"] { --bg: #0d1117; --text: #e6edf3; --muted: #8b949e; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 16px; text-align: center; }
    h1 { font-size: 64px; margin: 0; font-weight: 600; }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Not Found</p>
  </main>
</body>
</html>
